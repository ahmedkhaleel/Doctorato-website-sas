<!--
  Email signature — Classic layout (Doctorato brand)

  HOW TO USE in Gmail:
    1. Open Gmail → Settings (gear icon) → See all settings
    2. Scroll down to "Signature" → Create new
    3. Open this file in browser, select all (Cmd+A), copy (Cmd+C)
    4. Paste into the signature box
    5. Save changes

  HOW TO USE in Outlook:
    1. File → Options → Mail → Signatures
    2. New → name it "Doctorato"
    3. Open this file in browser, copy, paste into the editor
    4. Set as default for new messages + replies
    5. OK

  HOW TO USE in Apple Mail:
    1. Mail → Settings → Signatures
    2. Drag this file to the signatures panel
    3. Uncheck "Always match my default message font"

  EDIT YOUR DETAILS:
  Search for [YOUR_*] markers below and replace.
-->
